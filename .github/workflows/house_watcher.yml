name: House Watcher

on:
  # Manual runs only. The Windows local daemon is the primary watcher.
  workflow_dispatch:
    inputs:
      test_slack:
        description: "Only send a Slack test message; do not query housing sites."
        required: false
        default: false
        type: boolean
permissions:
  contents: read

concurrency:
  group: house-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run watcher once
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WATCH_RULES_JSON: ${{ secrets.WATCH_RULES_JSON }}
        run: |
          if [ "${{ inputs.test_slack }}" = "true" ]; then
            python scripts/run_watcher_once.py --test-slack
          else
            python scripts/run_watcher_once.py
          fi
